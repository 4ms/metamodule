<?xml version="1.0" encoding="UTF-8"?>
<!-- Toolbar icon: Knob Sets, while pressed (slightly bigger). 32px on MP1's screen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <mask id="pointer">
    <rect width="32" height="32" fill="#fff"/>
    <line x1="17.65" y1="14.55" x2="21.95" y2="10.25" stroke="#000" stroke-width="4.8" stroke-linecap="round"/>
  </mask>
  <circle cx="16" cy="16" r="15.2" fill="#e6e6e6" mask="url(#pointer)"/>
</svg>
